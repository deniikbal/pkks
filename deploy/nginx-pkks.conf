# Vhost nginx untuk pkks.sman1bantarujeg.sch.id
# Simpan ke /www/server/panel/vhost/nginx/pkks.conf SETELAH DNS record A
# mengarah ke server ini dan sertifikat sudah diterbitkan. Menyalin berkas ini
# sebelum sertifikat ada akan membuat nginx gagal reload.

server {
    listen 80;
    server_name pkks.sman1bantarujeg.sch.id;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/pkks-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pkks.sman1bantarujeg.sch.id;

    ssl_certificate     /etc/letsencrypt/live/pkks.sman1bantarujeg.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pkks.sman1bantarujeg.sch.id/privkey.pem;

    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    access_log /www/wwwlogs/pkks.access.log;
    error_log  /www/wwwlogs/pkks.error.log;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
